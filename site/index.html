<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mega Hub</title>
<style>
:root{--bg:#0f1117;--card:#181b24;--fg:#e6e8ee;--mut:#8b91a1;--ac:#6ee7a8;--bd:#272b38}
@media(prefers-color-scheme:light){:root{--bg:#f6f7fb;--card:#fff;--fg:#1a1d27;--mut:#666d80;--ac:#0a8f54;--bd:#dde0ea}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;display:flex;min-height:100vh}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
nav{width:230px;flex:none;border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:18px;margin:0 8px 12px}
nav button,nav a.mc{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:6px 8px;border-radius:6px;font:inherit;cursor:pointer}
nav button:hover,nav button.on{background:var(--card);color:var(--ac)}
nav a.mc{background:var(--ac);color:#06210f;font-weight:700;margin-bottom:8px;text-decoration:none}
main{flex:1;min-width:0;padding:20px 28px}
#q{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;margin-bottom:18px}
h2{margin:22px 0 8px;font-size:18px}h2:first-child{margin-top:0}
.hero{display:block;padding:22px;border-radius:12px;background:linear-gradient(135deg,#1d6b3f,#2b3a8f);color:#fff;margin-bottom:18px;text-decoration:none}
.hero b{font-size:22px}.hero:hover{text-decoration:none;filter:brightness(1.1)}
ul{list-style:none;margin:0;padding:0}li{padding:6px 10px;border-bottom:1px solid var(--bd);overflow-wrap:anywhere}
li a+a{margin-left:2px}.g{display:flex;gap:12px;justify-content:space-between}.g span{color:var(--mut);white-space:nowrap}
code{background:var(--card);padding:1px 5px;border-radius:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tiles button{background:var(--card);border:1px solid var(--bd);color:var(--fg);padding:14px;border-radius:10px;font:inherit;cursor:pointer;text-align:left}
.tiles button:hover{border-color:var(--ac)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--fg)}.card:hover{border-color:var(--ac);text-decoration:none}.card span{color:var(--ac);font-size:13px}.mut{color:var(--mut)}
@media(max-width:700px){body{display:block}nav{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px;border:0}nav h1{width:100%}nav button,nav a.mc{width:auto}main{padding:14px 16px}}
</style></head><body>
<nav id="nav"></nav>
<main><input id="q" type="search" placeholder="Search everything (games + all links)…" autocomplete="off"><div id="v"></div></main>
<script src="data.js"></script>
<script>
const MC='https://getmantle.pages.dev/',$=s=>document.getElementById(s),esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const P=DATA.pages,G=DATA.games,V=$('v'),Q=$('q');
const gameLi=g=>`<li class="g"><b>${esc(g[0])}</b><span>${g[1]?`<a href="${g[1]}" target="_blank" rel="noopener noreferrer">▶ Play</a> `:''}${g[2]?`<a href="${g[2]}" target="_blank" rel="noopener noreferrer">Repo</a>`:''}</span></li>`;
const hero=`<a class="hero" href="${MC}" target="_blank" rel="noopener noreferrer"><b>⛏ Modded Minecraft</b><div>${MC}</div></a>`;
function nav(cur){
 $('nav').innerHTML=`<h1>Mega Hub</h1><a class="mc" href="${MC}" target="_blank" rel="noopener noreferrer">⛏ Modded Minecraft</a><button data-k="home" class="${cur=='home'?'on':''}">Home</button><button data-k="games" class="${cur=='games'?'on':''}">Web Game Ports (${G.length})</button>`+P.map((p,i)=>`<button data-k="${i}" class="${cur===String(i)?'on':''}">${esc(p.n)}</button>`).join('');
}
function show(k){
 Q.value='';nav(k);scrollTo(0,0);
 if(k=='home')V.innerHTML=hero+`<h2>Browse</h2><div class="tiles"><button data-k="games"><b>🎮 Web Game Ports</b><br><span class="mut">${G.length} games</span></button>`+P.map((p,i)=>`<button data-k="${i}"><b>${esc(p.n)}</b><br><span class="mut">${p.s.reduce((a,s)=>a+s.i.length,0)} links</span></button>`).join('')+`</div><h2>🎮 Play now</h2><div class="cards">${G.filter(g=>g[1]).map(g=>`<a class="card" href="${g[1]}" target="_blank" rel="noopener noreferrer"><b>${esc(g[0])}</b><span>▶ Play</span></a>`).join('')}</div>`;
 else if(k=='games')V.innerHTML=`<h2>Web Game Ports</h2><ul>${G.map(gameLi).join('')}</ul>`;
 else V.innerHTML=P[k].s.map(s=>`<h2>${esc(s.t)}</h2><ul>${s.i.map(x=>`<li>${x}</li>`).join('')}</ul>`).join('');
}
$('nav').onclick=V.onclick=e=>{const b=e.target.closest('button[data-k]');if(b)show(b.dataset.k)};
const strip=h=>h.replace(/<[^>]+>/g,'').toLowerCase();
const idx=P.flatMap(p=>p.s.flatMap(s=>s.i.map(h=>[strip(h),h,p.n])));
let t;Q.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{
 const q=Q.value.trim().toLowerCase();if(!q)return show('home');nav('');
 const g=G.filter(x=>x[0].toLowerCase().includes(q)),l=idx.filter(x=>x[0].includes(q));
 V.innerHTML=(('minecraft mod mantle'.includes(q)||q.includes('minecraft'))?hero:'')+`<h2>Games (${g.length})</h2><ul>${g.slice(0,200).map(gameLi).join('')}</ul><h2>Links (${l.length})</h2><ul>${l.slice(0,300).map(x=>`<li>${x[1]} <span class="mut">· ${esc(x[2])}</span></li>`).join('')}</ul>`;
},150)};
show('home');
</script></body></html>
